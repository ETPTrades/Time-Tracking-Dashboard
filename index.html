<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="style.css/global.css" />
    <link rel="stylesheet" href="style.css/fonts.css" />

    <title>Frontend Mentor | Time tracking dashboard</title>
  </head>
  <body>
    <main class="grid-parent">
      <article class="profile">
        <div class="profile__description">
          <img
            src="images/image-jeremy.png"
            alt=""
            width="64"
            height="64"
            class="profile__image"
          />
          <p class="profile__para">Report for</p>
          <h1 class="profile__header">Jeremy Robson</h1>
        </div>
        <div class="profile__weekly-container">
          <span class="profile__text">Daily</span>
          <span class="profile__text">Weekly</span>
          <span class="profile__text">Monthly</span>
        </div>
      </article>
      <article class="category-container work">
        <img src="images/icon-work.svg" alt="" class="icon" />
        <div class="category-container__sub-grid">
          <h2 class="category__title">Work</h2>
          <span class="category__total-hours">32hrs</span>
          <img
            src="images/icon-ellipsis.svg"
            alt=""
            class="category__elipsis"
          />
          <span class="category__weekly-hours">Last Week - 36hrs</span>
        </div>
      </article>
      <article class="category-container play">
        <img src="images/icon-play.svg" alt="" class="icon" />
        <div class="category-container__sub-grid">
          <h2 class="category__title">Play</h2>
          <span class="category__total-hours">10hrs</span>
          <img
            src="images/icon-ellipsis.svg"
            alt=""
            class="category__elipsis"
          />
          <span class="category__weekly-hours">Last Week - 8hrs</span>
        </div>
      </article>
      <article class="category-container study">
        <img src="images/icon-study.svg" alt="" class="icon" />
        <div class="category-container__sub-grid">
          <h2 class="category__title">Study</h2>
          <span class="category__total-hours">4hrs</span>
          <img
            src="images/icon-ellipsis.svg"
            alt=""
            class="category__elipsis"
          />
          <span class="category__weekly-hours">Last Week - 7hrs</span>
        </div>
      </article>
      <article class="category-container exercise">
        <img src="images/icon-exercise.svg" alt="" class="icon" />
        <div class="category-container__sub-grid">
          <h2 class="category__title">Exercise</h2>
          <span class="category__total-hours">4hrs</span>
          <img
            src="images/icon-ellipsis.svg"
            alt=""
            class="category__elipsis"
          />
          <span class="category__weekly-hours">Last Week - 5hrs</span>
        </div>
      </article>
      <article class="category-container social">
        <img src="images/icon-social.svg" alt="" class="icon" />
        <div class="category-container__sub-grid">
          <h2 class="category__title">Social</h2>
          <span class="category__total-hours">5hrs</span>
          <img
            src="images/icon-ellipsis.svg"
            alt=""
            class="category__elipsis"
          />
          <span class="category__weekly-hours">Last Week - 10hrs</span>
        </div>
      </article>
      <article class="category-container self-care">
        <img src="images/icon-self-care.svg" alt="" class="icon" />
        <div class="category-container__sub-grid">
          <h2 class="category__title">Self Care</h2>
          <span class="category__total-hours">2hrs</span>
          <img
            src="images/icon-ellipsis.svg"
            alt=""
            class="category__elipsis"
          />
          <span class="category__weekly-hours">Last Week - 2hrs</span>
        </div>
      </article>
    </main>
    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Your Name Here</a>.
    </footer>
  </body>
</html>
